name: Sync backend and admin repositories

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sync-split-repos-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out WingDex-Main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push backend
        env:
          DESTINATION_TOKEN: ${{ secrets.DESTINATION_TOKEN }}
        run: |
          set -euo pipefail

          split_commit="$(git subtree split --prefix=backend)"
          auth="$(printf 'x-access-token:%s' "$DESTINATION_TOKEN" | base64 -w0)"

          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/Ydzz18/WingDex-backend.git \
            "$split_commit:refs/heads/main"

      - name: Sync and push admin
        env:
          DESTINATION_TOKEN: ${{ secrets.DESTINATION_TOKEN }}
        run: |
          set -euo pipefail

          auth="$(printf 'x-access-token:%s' "$DESTINATION_TOKEN" | base64 -w0)"
          destination_dir="$RUNNER_TEMP/wingdex-admin"

          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            clone --branch main --single-branch \
            https://github.com/Ydzz18/WingDex-Admin.git "$destination_dir"

          rsync --archive --delete \
            --exclude='.git/' \
            --exclude='LICENSE' \
            "$GITHUB_WORKSPACE/admin/" "$destination_dir/"

          git -C "$destination_dir" config user.name "github-actions[bot]"
          git -C "$destination_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$destination_dir" add --all

          if git -C "$destination_dir" diff --cached --quiet; then
            echo "Admin repository is already up to date."
          else
            git -C "$destination_dir" commit -m "Sync admin from WingDex-Main (${GITHUB_SHA})"
            git -C "$destination_dir" \
              -c "http.extraheader=AUTHORIZATION: basic $auth" \
              push origin HEAD:main
          fi
